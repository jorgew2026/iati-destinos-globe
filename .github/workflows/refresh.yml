name: Refresh GA4 data and deploy

on:
  schedule:
    - cron: '5 * * * *'   # every hour (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.GA4_SA_KEY != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch GA4 and build data.json
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
        run: |
          pip install --quiet google-analytics-data
          printf '%s' "$GA4_SA_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          RANGE=$(python scripts/fetch_ga4.py)
          python scripts/build.py $RANGE
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Commit data.json (keeps the schedule alive)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || (git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
